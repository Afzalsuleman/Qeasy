spring:
  application:
    name: smart-queue

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_queue}
    username: ${DB_USERNAME:sq_user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: SmartQueueHikariPool

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway handles schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true  # Safety: Never clean production DB

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

  # Email Configuration (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:your-email@gmail.com}
    password: ${GMAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Thymeleaf Configuration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Application Configuration
app:
  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}
    expiration: 86400000  # 24 hours in milliseconds
    issuer: smart-queue-api

  # OTP Configuration
  otp:
    length: 6
    expiration: 300  # 5 minutes in seconds

  # Queue Configuration
  queue:
    default-max-size: 50
    default-avg-service-time: 15  # minutes
    no-show-timeout: 180  # 3 minutes in seconds

  # Email Configuration
  email:
    daily-limit: 500  # Gmail free limit
    warning-threshold: 400  # 80% of limit
    alert-threshold: 450  # 90% of limit
    from-name: Smart Queue
    from-email: ${GMAIL_USERNAME:your-email@gmail.com}

  # Scheduler Configuration
  scheduler:
    no-show-detection:
      enabled: true
      fixed-rate: 30000  # 30 seconds
      initial-delay: 10000  # 10 seconds
    queue-log-cleanup:
      enabled: true
      cron: "0 0 2 * * ?"  # Daily at 2 AM UTC
      retention-days: 30
    email-count-reset:
      enabled: true
      cron: "0 0 0 * * ?"  # Daily at midnight UTC

  # CORS Configuration
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      emailService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 60000  # 60 seconds
        failureRateThreshold: 50  # 50%
        slowCallRateThreshold: 50  # 50%
        slowCallDurationThreshold: 5000  # 5 seconds
        recordExceptions:
          - org.springframework.mail.MailException
        ignoreExceptions:
          - com.smartqueue.exception.EmailLimitExceededException

  retry:
    instances:
      emailService:
        maxAttempts: 3
        waitDuration: 1000  # 1 second
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.mail.MailException
        ignoreExceptions:
          - com.smartqueue.exception.EmailLimitExceededException

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  health:
    redis:
      enabled: true
    db:
      enabled: true
    mail:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.smartqueue: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  file:
    name: logs/smart-queue.log
    max-size: 10MB
    max-history: 30

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: Smart Queue Management API
    description: REST API for managing digital queues in shops
    version: 1.0.0
    contact:
      name: Smart Queue Team
      email: support@smartqueue.com

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.mailtrap.io  # Use Mailtrap for dev testing
    port: 2525

logging:
  level:
    com.smartqueue: DEBUG

---
# Test Profile
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025  # GreenMail test SMTP server

resilience4j:
  circuitbreaker:
    instances:
      emailService:
        registerHealthIndicator: false

---
# Production Profile
spring:
  config:
    activate:
      on-profile: production
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 50

logging:
  level:
    root: WARN
    com.smartqueue: INFO
