version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smart-queue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_queue
      POSTGRES_USER: sq_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sq_user -d smart_queue"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smart-queue-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: smart-queue-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
      --save 300 100
      --save 900 1
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - smart-queue-network

  # Smart Queue Backend (Uncomment when ready to deploy)
  # backend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: smart-queue-backend
  #   restart: unless-stopped
  #   environment:
  #     SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_NAME: smart_queue
  #     DB_USERNAME: sq_user
  #     DB_PASSWORD: ${DB_PASSWORD:-password}
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     JWT_SECRET: ${JWT_SECRET}
  #     GMAIL_USERNAME: ${GMAIL_USERNAME}
  #     GMAIL_PASSWORD: ${GMAIL_PASSWORD}
  #   ports:
  #     - "${SERVER_PORT:-8080}:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s
  #   networks:
  #     - smart-queue-network

networks:
  smart-queue-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
